services:
  sunum:
    image: nginx:1.27-alpine
    # Sunucuda port açılmaz; Dokploy (Traefik) container'ın 80 portuna yönlendirir.
    # Yerelde port açmak için: docker compose -f docker-compose.yml -f compose.local.yml up -d
    expose:
      - "80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
